name: Terraform Destroy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "destroy" to confirm tearing down every infra/ resource (GPU box, VPC, dead-man switch)'
        required: true
        type: string

permissions:
  id-token: write
  contents: read

concurrency:
  group: llm-infra-terraform
  cancel-in-progress: false

jobs:
  destroy:
    if: github.event.inputs.confirm == 'destroy'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Terraform init
        run: terraform init

      # my_ip/key_pair_name only need to satisfy variable validation here --
      # destroy tears down every resource in state regardless of their value.
      - name: Terraform destroy
        env:
          TF_VAR_my_ip: "0.0.0.0/32"
          TF_VAR_key_pair_name: ${{ vars.KEY_PAIR_NAME || 'disposable-dev' }}
        run: terraform destroy -auto-approve -input=false
